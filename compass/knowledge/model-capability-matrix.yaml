# ═══════════════════════════════════════════════════════
# Reviewer CLI 本地稳定性 / 场景画像
# 这是“本机此 Agent 工具在 headless/review 场景下的可靠度”维度，
# 与上面的模型能力分开记录。
# ═══════════════════════════════════════════════════════
reviewer_cli_profiles:
  codex:
    reviewer_local_stability: 5
    repo_inspection: true
    reviewer_notes: "本地 codex exec + --output-last-message 的只读 review 路径最稳定，适合结构化 stop-review。"
  copilot:
    reviewer_local_stability: 3
    repo_inspection: true
    reviewer_notes: "模型面强，但本地历史上出现过 timeout 与 completion-hook 干扰；适合 premium review，需保留超时与 guard 隔离。"
  claude:
    reviewer_local_stability: 3
    repo_inspection: true
    reviewer_notes: "能力强，但当前本地配置常经代理/别名复用，适合补位，不应盲目假设始终最稳。"
  gemini:
    reviewer_local_stability: 2
    repo_inspection: false
    reviewer_notes: "推理面不错，但本地 headless 登录态 / MCP / 超时噪声较多，更适合轻量探测或非 repo-inspection review。"
  kimi:
    reviewer_local_stability: 4
    repo_inspection: false
    reviewer_notes: "本地轻量 review / health probe 较稳，适合快速补位；复杂 repo-inspection 场景仍不如 codex/copilot/claude。"

# ═══════════════════════════════════════════════════════
# 路由算法（Dispatcher / stop-review 共同消费）
# ═══════════════════════════════════════════════════════
#
# 输入:
#   role          — 当前角色 (product-manager|architect|programmer|qa|reviewer)
#   registry      — agent-registry.yaml (嗅探脚本产出)
#   dev_agent     — 当前步骤的程序员所用 Agent（仅 reviewer 需要）
#
# 算法:
#   1. 从 registry 筛选 available=true 的 Agent
#   2. 展开可切换模型的 Agent（如 copilot 展开为多个 {cli}&{model} 候选）
#   3. 对每个候选 {cli}&{model}:
#      a. 在本矩阵查 model 的能力评分（未收录模型按 reasoning/coding/tool_use/instruction_following=3 兜底）
#      b. capability_score = models[model][role_req.primary] × 2
#                            + models[model][role_req.secondary] × 1
#      c. local_stability = reviewer_cli_profiles[cli].reviewer_local_stability
#      d. issue_penalty = agent.known_issues + model.known_issues（上限 3）
#      e. final_score = capability_score × 10 + local_stability × 3 - issue_penalty × 4
#      f. reviewer 如要求 repo-inspection，则不支持 repo_inspection 的 CLI 直接跳过
#   4. 过滤未满足 role_minimum_thresholds 的候选
#   5. 按 final_score 降序；若并列，再按 capability_score、local_stability、cost_efficiency 降序；
#      再并列时，专用 CLI > 通用 CLI 代理
#   6. 输出有序列表，Dispatcher/stop-review 取第 1 个为首选，其余为 Fallback
#
# 设计口径:
#   - 不再对 Gemini/Kimi 或 Copilot/Codex 施加静态家族偏置。
#   - 选择逻辑的第一层是“业内模型能力评价”，第二层是“本机此 CLI 的实际稳定性画像”。
#   - Codex-family ≤2 只是一条并发控制红线，不是排序加分或减分项。
#
# 锁定规则:
#   一旦某步骤（如 PM_WORKING step 1）选定 Agent，写入 state.yaml:
#     current_role:
#       agent: "copilot&claude-opus-4.6"
#       locked: true
#   该步骤内即使出现非致命错误也不切换。
#   仅当连续 2 次失败时触发 Fallback，从列表中取下一个。
#   新步骤开始时重新计算（失败计数归零，重读 registry）。

# ═══════════════════════════════════════════════════════
# 矩阵维护规范
# ═══════════════════════════════════════════════════════
#
# 更新频率: 每 30 天（日历提醒）或遇以下事件时立即更新：
#   - 主力模型（claude/gemini/gpt）发布新版本
#   - 发现某模型评分与实测偏差 ≥1 分
#   - RedCap 新增一个 known_issue 指向某模型
#   - 本地 CLI 稳定性画像显著变化（例如登录态恢复、timeout 修补、生效路径改变）
#
# 更新步骤:
#   1. 更新模型条目（评分 + source 注明评估日期）
#   2. 更新 reviewer_cli_profiles（stability / repo_inspection / notes）
#   3. 对比新评分与路由算法：是否影响各角色首选模型
#   4. 若首选变更 → 更新 agent-registry.yaml / stop-review / task report 口径
#   5. 在 CONTRIBUTING.md、agent-adapters.md 中同步算法摘要
#
# Frame 阶段集成:
#   Prism Frame 阶段（拆分独立任务、选型雇佣兵）必须读取本文件，
#   根据路由算法为每个子任务选择最合适的 {cli}&{model} 组合。
#   禁止在 Frame 阶段凭记忆选型，必须引用矩阵评分。
