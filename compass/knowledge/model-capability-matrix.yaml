# 模型能力参考矩阵
# 数据来源: Gemini 报告排名 + RedCap 实测经验 (lessons.md)
# 更新频率: 随新模型上线或新经验积累时更新
#
# ── 更新周期追踪 ──────────────────────────────────────────
# last_updated:  2026-04-11
# next_review:   2026-05-11
# ─────────────────────────────────────────────────────────
# Cap 每次任务启动时检查：若 today >= next_review，触发矩阵更新流程
# （见 CONTRIBUTING.md §11）
#
# 评分说明:
#   1-5 整数（5=顶级）
#   reasoning:              逻辑推理与架构设计
#   coding:                 全栈编码能力
#   instruction_following:  指令遵从与精准执行
#   tool_use:               工具使用（Shell/API/文件操作）
#   cost_efficiency:        成本效益（5=最便宜/免费）

# ═══════════════════════════════════════════════════════
# 角色能力需求（权重: primary ×2, secondary ×1）
# ═══════════════════════════════════════════════════════
role_requirements:
  product-manager:
    primary: instruction_following   # 需求采集必须忠实、结构化
    secondary: reasoning             # 理解业务逻辑
  architect:
    primary: reasoning               # 架构决策 = 深度推理
    secondary: coding                # 理解技术约束
  programmer:
    primary: coding                  # 编码是核心
    secondary: tool_use              # 执行命令、操作文件
  qa:
    primary: tool_use                # 执行测试、断言验证
    secondary: instruction_following # 遵循测试计划
  reviewer:
    primary: reasoning               # 独立判断代码质量
    secondary: coding                # 理解实现细节
    constraint: cross_family         # 与 Dev Agent 不同模型族优先

# ═══════════════════════════════════════════════════════
# 角色最低能力门槛（Fallback 降级时的硬性底线）
# Agent 降级时，目标 Model 必须满足对应角色的每项最低分
# 不达标的 Model 直接跳过，宁可继续降级也不用不够格的 Model
# 详见 agent-adapters.md §6.3.1
# ═══════════════════════════════════════════════════════
role_minimum_thresholds:
  product-manager:
    instruction_following: 3       # PM 必须能准确采集需求
    reasoning: 2
  architect:
    reasoning: 4                   # 架构师必须有强推理能力
    coding: 3
  programmer:
    coding: 4                      # 程序员必须能写高质量代码
    tool_use: 3
  qa:
    tool_use: 3                    # QA 必须能执行测试
    instruction_following: 3
  reviewer:
    reasoning: 4                   # Reviewer 必须能独立判断
    coding: 3

