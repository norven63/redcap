# 模型能力参考矩阵
# 数据来源: 业内公开评价 + RedCap 本地实测经验 (lessons.md / host reliability)
# 更新频率: 随新模型上线或新经验积累时更新
#
# ── 更新周期追踪 ──────────────────────────────────────────
# last_updated:  2026-04-21
# next_review:   2026-05-21
# ─────────────────────────────────────────────────────────
# Cap 每次任务启动时检查：若 today >= next_review，触发矩阵更新流程
# （见 CONTRIBUTING.md §11）
#
# 评分说明:
#   1-5 整数（5=顶级）
#   reasoning:              逻辑推理与架构设计
#   coding:                 全栈编码能力
#   instruction_following:  指令遵从与精准执行
#   tool_use:               工具使用（Shell/API/文件操作）
#   cost_efficiency:        成本效益（5=最便宜/免费）

# ═══════════════════════════════════════════════════════
# 角色能力需求（权重: primary ×2, secondary ×1）
# ═══════════════════════════════════════════════════════
role_requirements:
  product-manager:
    primary: instruction_following
    secondary: reasoning
  architect:
    primary: reasoning
    secondary: coding
  programmer:
    primary: coding
    secondary: tool_use
  qa:
    primary: tool_use
    secondary: instruction_following
  reviewer:
    primary: reasoning
    secondary: coding
    constraint: cross_family

# ═══════════════════════════════════════════════════════
# 角色最低能力门槛（Fallback 降级时的硬性底线）
# ═══════════════════════════════════════════════════════
role_minimum_thresholds:
  product-manager:
    instruction_following: 3
    reasoning: 2
  architect:
    reasoning: 4
    coding: 3
  programmer:
    coding: 4
    tool_use: 3
  qa:
    tool_use: 3
    instruction_following: 3
  reviewer:
    reasoning: 4
    coding: 3

