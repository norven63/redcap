# ═══════════════════════════════════════════════════════
# 路由算法（Dispatcher 执行）
# ═══════════════════════════════════════════════════════
#
# 输入:
#   role          — 当前角色 (product-manager|architect|programmer|qa|reviewer)
#   registry      — agent-registry.yaml (嗅探脚本产出)
#   dev_agent     — 当前步骤的程序员所用 Agent（仅 reviewer 需要）
#
# 算法:
#   1. 从 registry 筛选 available=true 的 Agent
#   2. 展开可切换模型的 Agent（如 copilot 展开为 3 个候选）
#   3. 对每个候选 {cli}&{model}:
#      a. 在本矩阵查 model 的能力评分（未收录的模型按 all=3 兜底）
#      b. score = models[model][role_req.primary] × 2
#                + models[model][role_req.secondary] × 1
#      c. Reviewer 且 model.family != dev_agent.family → score += 2
#      d. agent.known_issues 非空 → score -= 1
#   4. 找出 top_score，并将满足以下条件的候选视为“能力相当带”：
#        - 已满足 role_minimum_thresholds
#        - score >= top_score - 1
#   5. 在“能力相当带”内，优先选择 cost_efficiency 更高的候选；
#      若 Gemini CLI 位于该带内且无阻塞性 known_issues，则优先于更高成本宿主
#   6. 若仍并列，再按 score 降序；同分时: 专用 CLI > 通用 CLI（如 kimi CLI > claude-code 代理 kimi）
#   7. 输出有序列表，Dispatcher 取第 1 个为首选，其余为 Fallback
#
# 锁定规则:
#   一旦某步骤（如 PM_WORKING step 1）选定 Agent，写入 state.yaml:
#     current_role:
#       agent: "copilot&claude-opus-4.6"
#       locked: true
#   该步骤内即使出现非致命错误也不切换。
#   仅当连续 2 次失败时触发 Fallback，从列表中取下一个。
#   新步骤开始时重新计算（失败计数归零，重读 registry）。

  gemini-2.5-pro:
    family: google
    tier: premium
    reasoning: 5
    coding: 4
    instruction_following: 4
    tool_use: 4
    cost_efficiency: 3
    source: "RedCap 实测 2026-04 + 官方发布：Gemini 2.5 Pro 正式版，推理能力显著提升"
    known_issues:
      - "L-7: 不同工作目录调用可能创建新 session，续接时需显式 --resume"

  gemini-2.5-flash:
