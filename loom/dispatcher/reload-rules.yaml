# 常驻规范重载配置
# 
# 解决长任务中 SKILL.md 等规范被上下文压缩导致规则退化的问题。
# Dispatcher 在指定检查点 read_file 对应文件段落，强制刷新上下文中的规则。
#
# 原理：read_file 调用会把文件内容注入到最新的上下文位置，不受之前压缩影响。

# ── 新会话复活后重读（恢复人格 + 执行保障 + 首读索引）──
on_session_revival:
  - file: "compass/soul.md"
    sections: "§6 复活协议, §6·补 identity.md 更新规则"
    reason: "恢复 Cap 人格、身份资产保护与复活执行顺序"
  - file: "compass/CONTRIBUTING.core.md"
    reason: "恢复启动必读核心契约，保证全文规范权威不依赖默认大文件注入"
  - file: "compass/CONTRIBUTING.md"
    sections: "§2.1 对外术语, §3 经验沉淀, §11 棱镜, §13 任务级完成复盘"
    reason: "恢复对外汇报、lessons、Prism 与收尾复盘纪律"
  - file: "compass/knowledge/lessons.md"
    sections: "active lessons"
    reason: "恢复已知失败模式和经验防护"
  - file: "compass/knowledge/index.md"
    reason: "knowledge 考古先读导航，避免默认全量读取宿主资料、探索记录与历史经验"
  - file: "compass/docs/catalog.json"
    sections: "summary + entries"
    reason: "仅作为 docs 考古索引；真实打开源文档前仍需 redcap-docs-catalog.sh plan/budget，避免默认全量读取历史 evidence"
  - file: "references/execution-guarantees.json"
    reason: "恢复哪些规则必须有脚本、Hook、validator 或 manual-only 边界"
  - file: "prism/protocol.md"
    sections: "Dispatch, Collect, Synthesize, Archive"
    reason: "防止把轻量独立审查误报为正式 Prism"

# ── 每次角色切换时重读（最关键的检查点）──
on_role_switch:
  - file: "SKILL.md"
    sections: "§5.10 Hooks表, §5.7 交付物校验"
    reason: "防止 hooks 动作细节和校验规则在上下文压缩后丢失"
  - file: "SKILL.md"
    sections: "§5.5 Fallback 路由"
    reason: "防止 Agent 路由优先级退化为随机选择"

# ── 即将执行 git commit 前重读 ──
before_commit:
  - file: "references/commit-standards.md"
    reason: "确保 commit 格式符合规范"

# ── 即将结束整个任务（ALL_DONE）前重读 ──
before_task_complete:
  - file: "SKILL.md"
    sections: "§5.9 收尾清理, §5.11 飞书通知"
    reason: "确保清理步骤和飞书通知不被遗漏"

# ── 进入 PAUSED 状态时重读 ──
on_paused:
  - file: "SKILL.md"
    sections: "§5.11 飞书通知集成"
    reason: "确保飞书 ask/resume 的前台阻塞机制正确执行"
